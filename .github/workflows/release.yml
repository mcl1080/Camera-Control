name: Build APK

# - Pull requests and manual runs: build the APK and attach it to the run as a download
#   (signed with the release key if the secrets are set, otherwise with a debug key).
# - Pushing a tag like v0.3.0: build a release-signed APK and create a DRAFT pre-release
#   with it. Nothing is public until you press "Publish release" on GitHub.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LATLO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/latlo-release.jks"
            echo "LATLO_KEYSTORE_PATH=$RUNNER_TEMP/latlo-release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::The LATLO_KEYSTORE_BASE64 secret is not set, so a release can't be signed. See RELEASING.md."
            exit 1
          else
            echo "::warning::No release keystore secret; this APK is signed with a debug key."
          fi

      - name: Run protocol tests
        run: ./gradlew :ptpip:test

      - name: Build the APK
        env:
          LATLO_KEYSTORE_PASSWORD: ${{ secrets.LATLO_KEYSTORE_PASSWORD }}
          LATLO_KEY_ALIAS: ${{ secrets.LATLO_KEY_ALIAS }}
          LATLO_KEY_PASSWORD: ${{ secrets.LATLO_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Platlo.versionName="${{ steps.version.outputs.name }}" \
            -Platlo.versionCode="${{ steps.version.outputs.code }}"
          mkdir -p dist
          apk="dist/Latlo-${{ steps.version.outputs.name }}.apk"
          apk="${apk//+/-}"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Latlo-apk
          path: dist/

      - name: Create a draft pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt \
            --draft --prerelease \
            --title "Latlo ${{ steps.version.outputs.name }} (test build)" \
            --notes-file .github/release-notes.md
